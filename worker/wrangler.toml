name = "uptempo"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Un solo Worker para los 30 clientes. Nunca uno por cliente.
# Agregar un cliente es insertar filas, no desplegar nada.
#
# OJO: este archivo es el de PRODUCCION (`npx wrangler deploy`).
# `npm run dev` usa wrangler.dev.toml, que es igual pero sin las
# [[routes]] — con las rutas puestas, el dev local recibe
# Host: uptempo.uy y las rutas de admin se cierran solas.

[vars]
# En local gana el ENTORNO de .dev.vars. Este es el del Worker desplegado.
ENTORNO = "prod"

[observability]
enabled = true

# ---------------------------------------------------------------
# El reloj. Es lo unico del sistema que ocurre sin que nadie
# escriba nada: cada 15 minutos el Worker mira si hay algun turno
# a menos de 24 h sin recordatorio mandado.
#
# Cada 15 y no cada hora porque el recordatorio sale a la hora del
# turno menos 24; con cadencia horaria se corre hasta 59 minutos y
# un recordatorio de las 9 de la mañana puede llegar a las 10.
# 96 invocaciones por dia: irrelevante contra el limite del plan.
# ---------------------------------------------------------------
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------
# Rutas de produccion. Activas desde el 2026-09-08: nic.uy ya publica
# luciana.ns.cloudflare.com y tim.ns.cloudflare.com para uptempo.uy.
#
# El wildcard de un solo nivel es lo que hace que dar de alta un
# cliente no toque DNS ni certificados: Universal SSL cubre
# uptempo.uy y *.uptempo.uy gratis. Nunca dos niveles.
#
# OJO: una ruta de Worker necesita igual un registro DNS en la zona
# que la haga "proxied" (la nube naranja). Sin eso el nombre no
# resuelve y la ruta no llega a evaluarse nunca. Con un AAAA a 100::
# —la direccion de descarte de IPv6— alcanza: no hay servidor detras,
# el Worker contesta antes.
# ---------------------------------------------------------------
[[routes]]
pattern = "*.uptempo.uy/*"
zone_name = "uptempo.uy"

[[routes]]
pattern = "uptempo.uy/*"
zone_name = "uptempo.uy"

# ---------------------------------------------------------------
# Secretos (NO van aca). Se cargan una sola vez con:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put PEPPER_TELEFONO
# En local van en .dev.vars, que esta en .gitignore.
# ---------------------------------------------------------------
